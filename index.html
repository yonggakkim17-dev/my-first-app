<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <style>
    :root {
      --bg-1: #a5b4fc;
      --bg-2: #f9a8d4;
      --card: rgba(255, 255, 255, 0.82);
      --text: #1e1b4b;
      --muted: #6b7280;
      --line: rgba(99, 102, 241, 0.12);
      --accent: #6366f1;
      --accent-2: #ec4899;
      --item: #ffffff;
      --item-hover: #f5f3ff;
      --danger: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-1: #1e1b4b;
        --bg-2: #4a044e;
        --card: rgba(24, 24, 40, 0.8);
        --text: #eef2ff;
        --muted: #a1a1aa;
        --line: rgba(165, 180, 252, 0.15);
        --item: rgba(255, 255, 255, 0.04);
        --item-hover: rgba(255, 255, 255, 0.08);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 56px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
      background-attachment: fixed;
    }

    .app {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(30, 27, 75, 0.25);
      padding: 28px 24px 20px;
    }

    header { margin-bottom: 20px; }
    .date { margin: 0 0 4px; font-size: 14px; color: var(--muted); font-weight: 500; }
    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .progress { margin-top: 16px; }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .bar {
      height: 8px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.4s ease;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    #todo-input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      font-size: 16px;
      color: var(--text);
      background: var(--item);
      border: 2px solid transparent;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(30, 27, 75, 0.06);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #todo-input::placeholder { color: var(--muted); }
    #todo-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }
    .add-btn {
      flex-shrink: 0;
      width: 52px;
      border: none;
      border-radius: 14px;
      font-size: 26px;
      line-height: 1;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 6px 16px rgba(236, 72, 153, 0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .add-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(236, 72, 153, 0.4); }
    .add-btn:active { transform: scale(0.95); }

    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: var(--item);
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(30, 27, 75, 0.05);
      transition: background 0.2s;
    }
    li.new { animation: pop-in 0.25s ease; }
    li:hover { background: var(--item-hover); }
    li.removing { animation: slide-out 0.25s ease forwards; }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(-6px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    @keyframes slide-out {
      to { opacity: 0; transform: translateX(40px); }
    }

    .check {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: transparent;
      color: #fff;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s, transform 0.15s;
    }
    .check:hover { transform: scale(1.1); }
    li.done .check {
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    li .text {
      flex: 1;
      font-size: 16px;
      word-break: break-all;
      cursor: pointer;
      transition: color 0.2s;
    }
    li.done .text { text-decoration: line-through; color: var(--muted); }

    .del-btn {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s, color 0.2s;
    }
    li:hover .del-btn, .del-btn:focus-visible { opacity: 1; }
    .del-btn:hover { background: rgba(239, 68, 68, 0.12); color: var(--danger); }
    @media (hover: none) { .del-btn { opacity: 1; } }

    .empty {
      text-align: center;
      padding: 28px 0 16px;
      color: var(--muted);
    }
    .empty .emoji { font-size: 40px; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <p id="date" class="date"></p>
      <h1>할 일 목록</h1>
      <div class="progress">
        <div class="progress-info">
          <span id="count">할 일을 추가해 보세요</span>
          <span id="percent"></span>
        </div>
        <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      </div>
    </header>

    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="오늘 무엇을 할까요?" autocomplete="off">
      <button type="submit" class="add-btn" aria-label="추가">+</button>
    </form>

    <ul id="todo-list"></ul>
    <div id="empty" class="empty">
      <span class="emoji">🌿</span>
      할 일이 없어요. 여유로운 하루!
    </div>
  </main>

  <script>
    const STORAGE_KEY = 'my-first-app-todos';
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');
    const percent = document.getElementById('percent');
    const barFill = document.getElementById('bar-fill');

    document.getElementById('date').textContent = new Date().toLocaleDateString('ko-KR', {
      month: 'long', day: 'numeric', weekday: 'long'
    });

    let todos = load();
    let newId = null;

    function load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (e) {
        // 저장이 막힌 환경에서는 메모리에서만 동작
      }
    }

    function render() {
      list.innerHTML = '';
      todos.forEach((todo) => {
        const li = document.createElement('li');
        if (todo.done) li.classList.add('done');
        if (todo.id === newId) li.classList.add('new');

        const check = document.createElement('button');
        check.className = 'check';
        check.textContent = todo.done ? '✓' : '';
        check.setAttribute('aria-label', todo.done ? '완료 취소' : '완료');
        check.addEventListener('click', () => toggleTodo(todo.id));

        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = todo.text;
        text.addEventListener('click', () => toggleTodo(todo.id));

        const del = document.createElement('button');
        del.className = 'del-btn';
        del.textContent = '×';
        del.setAttribute('aria-label', '삭제');
        del.addEventListener('click', () => {
          li.classList.add('removing');
          li.addEventListener('animationend', () => deleteTodo(todo.id), { once: true });
        });

        li.append(check, text, del);
        list.appendChild(li);
      });

      const total = todos.length;
      const doneCount = todos.filter((t) => t.done).length;
      const pct = total ? Math.round((doneCount / total) * 100) : 0;

      empty.hidden = total > 0;
      count.textContent = total ? `${total}개 중 ${doneCount}개 완료` : '할 일을 추가해 보세요';
      percent.textContent = total ? `${pct}%` : '';
      barFill.style.width = pct + '%';
      newId = null;
    }

    function addTodo(text) {
      newId = Date.now();
      todos.push({ id: newId, text, done: false });
      save();
      render();
    }

    function deleteTodo(id) {
      todos = todos.filter((t) => t.id !== id);
      save();
      render();
    }

    function toggleTodo(id) {
      const todo = todos.find((t) => t.id === id);
      if (todo) todo.done = !todo.done;
      save();
      render();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addTodo(text);
      input.value = '';
      input.focus();
    });

    render();
  </script>
</body>
</html>
